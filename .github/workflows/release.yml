# Publishes a GitHub Release with the game EXE.
# Runs when main changes the EXE or details/VERSION (the release is named after the version in that file),
# or by hand from the Actions tab. If the release already exists, its EXE is replaced.
name: Release
on:
  push:
    branches: [main]
    paths: ['Pixel-Rush-Game.exe', 'details/VERSION', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(tr -d ' \r\n' < details/VERSION)"
          TAG="v${VER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Pixel-Rush-Game.exe --clobber
          else
            gh release create "$TAG" Pixel-Rush-Game.exe --target "$GITHUB_SHA" --title "Pixel Rush ${VER}" --notes-file details/RELEASE_NOTES.md --latest
          fi
